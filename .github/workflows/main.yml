name: NASA MISSION CONTROL CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js '25'
        uses: actions/setup-node@v4
        with:
          node-version: "25"
      - run: npm run install-all
      - run: npm run build --prefix client
